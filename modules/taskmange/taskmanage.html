<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster</title>
    <link rel="stylesheet" href="taskmange.css">
    <link rel="stylesheet" href="../../component/sidebar/sidebar.css">
    <link rel="stylesheet" href="../../component/logoimg/logoimg.css">

</head>

<body>
    <div class="dashboard">


        <aside class="sidebar">
            <div class="logo">
                <div class="checkcolor">
                    <img src="../../assets/images/checkbox.svg" width="25px" height="25px">
                </div>
                <h4>TaskMaster</h4>
                <img id="leftlogo" src="../../assets/images/left.svg" width="5px" height="5px">
            </div>

            <div class="user-profile">
                <div class="avatar">M</div>
                <div class="user-info">
                    <h5>Momoh gbenuade</h5>
                    <p>momohgbenuade@gmail.com</p>
                </div>
            </div>
            <div class="menu1">
                <nav class="menu">
                    <div class="sidebarimg1">
                        <img src="../../assets/images/dash.svg" width="20px" height="20px"> <a href="#"
                            class="active">Dashboard</a>
                    </div>
                    <div class="sidebarimg1">
                        <img src="../../assets/images/check.svg" width="20px" height="20px"> <a href="#">Tasks</a>
                    </div>
                    <div class="sidebarimg1">
                        <img src="../../assets/images/person copy.svg" width="20px" height="20px">
                        <a href="#">Community</a>
                    </div>
                    <div class="sidebarimg1">
                        <img src="../../assets/images/dollar copy.svg" width="20px" height="20px"> <a
                            href="#">Expenses</a>
                    </div>
                    <div class="sidebarimg1">
                        <img src="../../assets/images/note copy.svg" width="20px" height="20px"> <a href="#">Notes</a>
                    </div>
                    <div class="sidebarimg1">
                        <img src="../../assets/images/setting.svg" width="20px" height="20px"> <a href="#">Settings</a>
                    </div>
                </nav>
            </div>
            <div class="footer">
                <div class="asidefooter">
                    <img src="../../assets/images/logout.svg" width="15px" height="15px">
                    <button class="logout-btn"> Logout</button>
                </div>
            </div>
        </aside>




        <main class="content">

            <div class="outercard">

                <div class="top-tabcontain">
                    <div class="kk">
                        <div class="header">
                            <div class="checkcolor">
                                <img src="../../assets/images/checkbox.svg" width="25px" height="25px">
                            </div>
                            <div>
                                <h4>Task Management</h4>
                                <p>Manage and track your tasks</p>
                            </div>
                        </div>
                    </div>
                    <div class="innercard">
                        <div>
                            <div class="secondtab">
                                <div class="top-tabs">
                                    <div class="top-tabs2">
                                        <div class="tabtive">
                                            <img class="markimg" src="../../assets/images/mark.svg" width="18px"
                                                height="18px">
                                            <button class="tab-active">My Tasks </button>
                                        </div>
                                        <div class="summaryimg">
                                            <img class="chartimg" src="../../assets/images/chart.svg" width="18px"
                                                height="18px">
                                            <button class="tab">AI Summary</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="stats">
                                    <div class="stat">
                                        <h3>0</h3>
                                        <p>Active tasks</p>
                                    </div>
                                    <span class="divider"></span>
                                    <div class="stat2">
                                        <h3>0</h3>
                                        <p>Completed</p>
                                    </div>
                                </div>
                            </div>
                            <div class="task-area">
                                <button class="add-task">+ Add Task</button>

                                <div class="empty-box">
                                    <div>
                                        <img src="../../assets/images/circle.svg" width="50px" height="50px">
                                        <p>No tasks yet</p>
                                        <p>Click "Add Task" to create your first task</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </div>

</body>

</html>
